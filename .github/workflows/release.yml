name: Release Theme

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0 — must match "version" in manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        id: project_info
        run: |
          jq empty manifest.json
          PROJECT_ID=$(jq -r '.id' manifest.json)
          VERSION=$(jq -r '.version' manifest.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          for f in id name description version; do
            if [ "$(jq -r ".$f // empty" manifest.json)" = "" ]; then
              echo "❌ manifest.json is missing \"$f\""; exit 1
            fi
          done
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "❌ Version mismatch: tag=$TAG_VERSION, manifest=$VERSION"; exit 1
          fi
          echo "✅ $PROJECT_ID $VERSION"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        id: create_zip
        run: |
          ZIP_NAME="${{ steps.project_info.outputs.project_id }}-${{ steps.project_info.outputs.version }}.zip"
          zip "$ZIP_NAME" manifest.json style.css README.md LICENSE
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          name: "Release v${{ steps.project_info.outputs.version }}"
          files: |
            ${{ steps.create_zip.outputs.zip_name }}
            manifest.json
